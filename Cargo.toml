[package]
name = "cargo-pkgman"
version = "0.2.0"
edition = "2024"
rust-version = "1.86"
description = "Package-manager style frontends for Cargo-installed applications"
license = "MIT"

[dependencies]
cargo-update = "=22.1.1"
home = "=0.5.9"

# The shared executable. Every frontend below is a launcher that
# re-invokes this one with `--frontend <name>`, so the package
# management logic and its dependencies are linked exactly once.
[[bin]]
name = "cargo-pkgman"
path = "src/main.rs"

[[bin]]
name = "cargo-pm"
path = "src/bin/cargo-pm.rs"

[[bin]]
name = "cargo-pacman"
path = "src/bin/cargo-pacman.rs"

[[bin]]
name = "cargo-apt"
path = "src/bin/cargo-apt.rs"

[[bin]]
name = "cargo-pkg"
path = "src/bin/cargo-pkg.rs"

[[bin]]
name = "cargo-dnf"
path = "src/bin/cargo-dnf.rs"
